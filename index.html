<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0047AB 0%, #002E73 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .welcome-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      padding: 3rem 2rem;
      width: 100%;
      max-width: 450px;
      margin: 1rem;
      text-align: center;
    }
    .welcome-card h1 {
      color: #0047AB;
      font-weight: bold;
      margin-bottom: 0.5rem;
    }
    .welcome-card p.subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    .btn-open {
      background-color: #E60012;
      color: white;
      font-weight: bold;
      border: none;
      padding: 0.7rem 2rem;
      font-size: 1.1rem;
      border-radius: 8px;
      width: 100%;
      text-decoration: none;
      display: inline-block;
    }
    .btn-open:hover {
      background-color: #cc0000;
      color: white;
    }
    .features-list {
      text-align: left;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }
    .features-list h6 {
      color: #0047AB;
      font-weight: bold;
    }
    .features-list ul {
      padding-left: 1.2rem;
      margin-bottom: 0;
      color: #444;
      font-size: 0.9rem;
    }
    .features-list li {
      margin-bottom: 0.3rem;
    }
  </style>
</head>
<body>

  <div class="welcome-card">
    <h1>🏍️ STORE INVENTORY</h1>
    <p class="subtitle">Inventory Management System</p>

    <!-- ==============================================
          👇 REPLACE THIS URL WITH YOUR WEB APP URL
          ============================================== -->
    <a href="https://script.google.com/macros/s/AKfycbxINiNMNXWtpljvtnTS7IrwyYpNF09F_HPVZilLS0SXickGeOiuQ2FJ66poriDVf8O_/exec" class="btn btn-open" target="_blank">
      📂 OPEN SYSTEM
    </a>

    <div class="features-list">
      <h6>✅ 7 Features Available:</h6>
      <ul>
        <li>📊 Dashboard Overview</li>
        <li>🏍️ Motorcycle Management</li>
        <li>🏷️ Categories</li>
        <li>🔄 Stock In / Sales</li>
        <li>📋 Inventory List & Search</li>
        <li>📈 Sales & Stock Reports</li>
        <li>👤 User & System Info</li>
      </ul>
    </div>
  </div>

</body>
</html>
