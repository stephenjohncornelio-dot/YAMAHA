<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamaha Store — Inventory System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0047AB 0%, #002E73 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
    }
    .yamaha-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .yamaha-logo h1 {
      color: #0047AB;
      font-weight: bold;
      font-size: 1.8rem;
      margin: 0;
    }
    .yamaha-logo p {
      color: #666;
      margin: 0.3rem 0 0 0;
    }
    .btn-yamaha {
      background-color: #E60012;
      color: white;
      font-weight: bold;
      border: none;
      padding: 0.6rem;
      font-size: 1.05rem;
    }
    .btn-yamaha:hover {
      background-color: #cc0000;
      color: white;
    }
    .form-control:focus {
      border-color: #0047AB;
      box-shadow: 0 0 0 0.2rem rgba(0,71,171,0.25);
    }
    .error-box {
      display: none;
      margin-top: 1rem;
      padding: 0.75rem;
      background: #ffe5e5;
      border-radius: 6px;
      color: #b30000;
      text-align: center;
    }
    @media (max-width: 480px) {
      .login-card { padding: 1.5rem; }
      .yamaha-logo h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="yamaha-logo">
      <h1>🏍️ YAMAHA STORE</h1>
      <p>Inventory Management System</p>
    </div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label fw-medium">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="your.email@example.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-yamaha w-100">LOGIN</button>

      <div id="errorMsg" class="error-box"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ==================================================
    // 🔧 PASTE YOUR APPS SCRIPT WEB APP URL HERE
    // ==================================================
    const APPSCRIPT_URL = "https://script.google.com/macros/s/REPLACE_THIS/exec";

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("errorMsg");

      errorBox.style.display = "none";

      try {
        // ✅ Simple & secure GET request — matches your Apps Script code
        const targetUrl = `${APPSCRIPT_URL}?page=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;

        const response = await fetch(targetUrl);
        const result = await response.json();

        if (result.success) {
          // Save session & redirect to dashboard
          localStorage.setItem("yamaha_sid", result.sid);
          localStorage.setItem("yamaha_email", email);
          // Go straight to dashboard with session ID
          window.location.href = `${APPSCRIPT_URL}?sid=${result.sid}&page=dashboard`;
        } else {
          showError(result.message || "❌ Invalid email or password");
        }

      } catch (error) {
        console.error("Login Error:", error);
        showError("⚠️ Connection failed.<br>Check your Web App URL and re-deploy.");
      }
    });

    function showError(message) {
      const errorBox = document.getElementById("errorMsg");
      errorBox.innerHTML = message;
      errorBox.style.display = "block";
    }
  </script>
</body>
</html>
